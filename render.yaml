# SupplySense - Render Production Blueprint Configuration
# Canonical Render specification for web service and managed PostgreSQL database

services:
  - type: web
    name: supplysense-backend
    runtime: python
    plan: free
    rootDir: smart-inventory-backend
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "gunicorn app:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supplysense-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"

databases:
  - name: supplysense-db
    databaseName: supplysense
    user: supplysense_user
    plan: free
